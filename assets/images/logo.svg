<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a38"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Reel Icon -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#logoGrad)" filter="url(#glow)"/>
    <circle cx="16" cy="16" r="9" fill="#0a0c10"/>
    <circle cx="16" cy="16" r="4" fill="#ffffff"/>
    <circle cx="16" cy="8" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="16" cy="24" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="8" cy="16" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="24" cy="16" r="2" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Text Brand -->
  <text x="46" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
    CINE<tspan fill="#e50914">STATIC</tspan>
  </text>
  <circle cx="178" cy="16" r="3" fill="#e50914"/>
</svg>
