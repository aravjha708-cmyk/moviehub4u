<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Film Reel Emblem -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#hubGrad)" filter="url(#glow)"/>
    <circle cx="17" cy="17" r="10" fill="#0d1117"/>
    <polygon points="14,11 23,17 14,23" fill="#ffffff"/>
    <circle cx="17" cy="6" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="17" cy="28" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="6" cy="17" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="28" cy="17" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <!-- "MOVIE" -->
  <text x="46" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
    MOVIE
  </text>
  <!-- "HUB" in Pill Badge -->
  <rect x="122" y="10" width="54" height="24" rx="4" fill="url(#hubGrad)"/>
  <text x="149" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="0.5" fill="#ffffff" text-anchor="middle">
    HUB
  </text>
  <!-- "4U" in Gold -->
  <text x="182" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5" fill="url(#goldGrad)">
    4U
  </text>
</svg>
