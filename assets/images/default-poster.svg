<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <rect width="500" height="750" fill="url(#spot)"/>
  <rect x="20" y="20" width="460" height="710" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Film reel emblem -->
  <g transform="translate(250, 310)" text-anchor="middle">
    <circle cx="0" cy="0" r="54" fill="#1b2030" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
    <circle cx="0" cy="0" r="22" fill="#e50914"/>
    <circle cx="0" cy="-32" r="7" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="32" r="7" fill="#ffffff" opacity="0.8"/>
    <circle cx="-32" cy="0" r="7" fill="#ffffff" opacity="0.8"/>
    <circle cx="32" cy="0" r="7" fill="#ffffff" opacity="0.8"/>
    <!-- Play Triangle -->
    <polygon points="-5,-8 10,0 -5,8" fill="#ffffff"/>
  </g>

  <text x="250" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    CINESTATIC
  </text>
  <text x="250" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">
    OFFICIAL POSTER PREVIEW
  </text>
</svg>
